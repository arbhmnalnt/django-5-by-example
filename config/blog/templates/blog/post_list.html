{% extends 'base.html' %}
{% block title %} list of posts{% endblock %}

{% block content %}
<h1>Posts</h1>

{% for post in posts %} 
    <h2>
        <a href="{% url 'blog:post_detail' post.slug %}">
            {{ post.title }}
        </a>
    </h2>
    <p>{{ post.body|truncatewords:20 }}</p>
{% endfor %}
{% endblock %}
