{% extends 'base.html' %}
{% block title %} list of posts{% endblock %}

{% block content %}
<h1>Posts</h1>

{% for post in posts %}
    {% if post.slug %}
        <a href="{% url 'blog:post_detail' post.slug %}">
            {{ post.title }}
        </a>
    {% else %}
        {{ post.title }}
    {% endif %}
    <br>
    
{% endfor %}
<br>
<hr>
<br>
{% if user.is_authenticated %}
    <a href="{% url 'blog:post_create' %}">Create Post</a>
{% endif %}
{% endblock %}
